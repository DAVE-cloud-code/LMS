<!DOCTYPE html>
<html>
<head>
    <title>Students</title>
    <link rel="stylesheet" href="css/dashboard.css">
      <style>

    :root{
        --primary:#22c55e;
        --primary-dark:#16a34a;
        --bg-light:#f0fdf4;
        --white:#ffffff;
        --text-dark:#1f2937;
    }

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, Helvetica, sans-serif;
    }

    body{
        background:var(--bg-light);
    }

    .dashboard{
        display:flex;
        min-height:100vh;
    }

    .main-content{
        flex:1;
        padding:40px;
    }

    .page-title{
        color:var(--primary-dark);
        margin-bottom:30px;
        font-size:32px;
    }

    .student-form{
        background:var(--white);
        padding:25px;
        border-radius:15px;
        box-shadow:0 8px 25px rgba(0,0,0,.08);
        display:flex;
        gap:15px;
        margin-bottom:35px;
    }

    .student-form input{
        flex:1;
        padding:14px;
        border:1px solid #d1d5db;
        border-radius:8px;
        outline:none;
        font-size:15px;
    }

    .student-form input:focus{
        border-color:var(--primary);
        box-shadow:0 0 0 3px rgba(34,197,94,.2);
    }

    .student-form button{
        background:var(--primary);
        color:white;
        border:none;
        padding:14px 28px;
        border-radius:8px;
        cursor:pointer;
        font-weight:bold;
        transition:.3s;
    }

    .student-form button:hover{
        background:var(--primary-dark);
    }

    .student-grid{
        display:grid;
        grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
        gap:25px;
    }

    .student-card{
        background:var(--white);
        border-radius:15px;
        padding:25px;
        box-shadow:0 8px 20px rgba(0,0,0,.08);
        transition:.3s;
    }

    .student-card:hover{
        transform:translateY(-5px);
    }

    .student-avatar{
        width:65px;
        height:65px;
        border-radius:50%;
        background:var(--primary);
        color:white;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:24px;
        font-weight:bold;
        margin-bottom:20px;
    }

    .student-card h3{
        color:var(--text-dark);
        margin-bottom:20px;
    }

.delete-btn{
    background:#ef4444;
    color:#fff;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
    font-weight:600;
    margin-top:15px;
    transition:all .3s ease;
}

.delete-btn:hover{
    background:#dc2626;
    transform:translateY(-2px);
    box-shadow:0 6px 15px rgba(220,38,38,.25);
}

.delete-btn:active{
    transform:scale(.98);
}

    @media(max-width:768px){

        .main-content{
            padding:20px;
        }

        .student-form{
            flex-direction:column;
        }

        .student-form button{
            width:100%;
        }

    }

    </style>
</head>
<body>

<div class="dashboard">
 <aside class="sidebar">
        <h2>Instructor Panel</h2>
        <a href="instructor-dashboard.html">Dashboard</a>
        <a href="upload.html">Upload Video</a>
        <!-- <a href="create-course.html">Create Course</a> -->
        <a href="attendance.html">Attendance</a>
        <a href="attendance-history.html">Attendance History</a>
        <a href="instructor-assignments.html">Assignments</a>
        <a href="#" onclick="logout()">Logout</a>
    </aside>

<main class="main-content">

    <h1 class="page-title">Manage Students</h1>

    <form id="studentForm" class="student-form">

        <input
            type="text"
            id="fullname"
            placeholder="Enter Student Name"
            required
        >

        <button type="submit">
            Add Student
        </button>

    </form>

    <div
        id="studentList"
        class="student-grid"
    ></div>

</main>

</div>

<script>
const token = localStorage.getItem("token");

const form = document.getElementById("studentForm");

const studentList = document.getElementById("studentList");

// ✅ Load students
async function loadStudents() {

    const res = await fetch(
        "https://lms-back-7t0r.onrender.com/api/students",
        {
            headers: {
                Authorization: `Bearer ${token}`
            }
        }
    );

    const students = await res.json();

    studentList.innerHTML = "";

    students.forEach(student => {

        studentList.innerHTML += `
            <div class="course-card">

                <h3>${student.fullname}</h3>

                <button  class="delete-btn" onclick="deleteStudent('${student._id}')">
                    Delete
                </button>

            </div>
        `;
    });
}

// ✅ Add student
form.addEventListener("submit", async (e) => {

    e.preventDefault();

    await fetch(
        "https://lms-back-7t0r.onrender.com/api/students/add",
        {
            method: "POST",

            headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`
            },

            body: JSON.stringify({
                fullname: fullname.value
            })
        }
    );

    form.reset();

    loadStudents();
});

// ✅ Delete student
async function deleteStudent(id) {

    await fetch(
        `https://lms-back-7t0r.onrender.com/api/students/${id}`,
        {
            method: "DELETE",

            headers: {
                Authorization: `Bearer ${token}`
            }
        }
    );

    loadStudents();
}

loadStudents();

function logout() {
    localStorage.clear();
    window.location.href = "login.html";
}
</script>

</body>
</html>
