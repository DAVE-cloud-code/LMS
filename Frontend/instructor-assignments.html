<!DOCTYPE html>
<html>
<head>
    <title>Create Assignment</title>
    <link rel="stylesheet" href="css/dashboard.css">

    <style>

:root{
    --primary:#22c55e;
    --primary-dark:#16a34a;
    --bg-light:#f0fdf4;
    --white:#ffffff;
    --text-dark:#1f2937;
}

body{
    margin:0;
    background:var(--bg-light);
    font-family:Arial, Helvetica, sans-serif;
}

.main-content{
    flex:1;
    padding:40px;
}

.page-title{
    color:var(--primary-dark);
    font-size:32px;
    margin-bottom:30px;
}

.assignment-card{
    max-width:700px;
    background:var(--white);
    padding:35px;
    border-radius:16px;
    box-shadow:0 8px 25px rgba(0,0,0,.08);
}

.assignment-card label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
    color:var(--text-dark);
}

.assignment-card input,
.assignment-card textarea,
.assignment-card select{
    width:100%;
    padding:14px;
    margin-bottom:20px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:15px;
    outline:none;
    transition:.3s;
    background:#fff;
}

.assignment-card textarea{
    resize:vertical;
    min-height:140px;
}

.assignment-card input:focus,
.assignment-card textarea:focus,
.assignment-card select:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 3px rgba(34,197,94,.2);
}

#createBtn{
    width:100%;
    padding:15px;
    background:var(--primary);
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
    transition:.3s;
}

#createBtn:hover{
    background:var(--primary-dark);
    transform:translateY(-2px);
    box-shadow:0 8px 18px rgba(34,197,94,.25);
}

#createBtn:disabled{
    opacity:.7;
    cursor:not-allowed;
}

#msg{
    margin-top:20px;
    text-align:center;
    font-weight:bold;
    font-size:16px;
}

@media(max-width:768px){

    .main-content{
        padding:20px;
    }

    .assignment-card{
        padding:25px;
    }

}

</style>
</head>
<body>

<div class="dashboard">

<aside class="sidebar">
    <h2>Instructor Panel</h2>
    <a href="instructor-dashboard.html">Dashboard</a>
                <a href="upload.html">Upload Video</a>
    <a href="students.html"> Add Students</a>
    <a href="attendance.html">Attendance</a>
    <a href="attendance-history.html">Attendance History</a>
    <a href="#" onclick="logout()">Logout</a>
</aside>

<main class="main-content">

    <h1 class="page-title">
        Create Assignment
    </h1>

    <div class="assignment-card">

        <form id="assignmentForm">

            <label>Assignment Title</label>

            <input
                type="text"
                id="title"
                placeholder="Enter assignment title"
                required
            >

            <label>Description</label>

            <textarea
                id="description"
                placeholder="Enter assignment description"
            ></textarea>

            <label>Due Date</label>

            <input
                type="date"
                id="dueDate"
                required
            >

            <button
                type="submit"
                id="createBtn"
            >
                Create Assignment
            </button>

            <p id="msg"></p>

        </form>

        <h2 style="margin-top:40px;">My Assignments</h2>

<div id="assignmentsContainer"></div>

    </div>

</main>
</div>
<script>
const token = localStorage.getItem("token");
const user = JSON.parse(localStorage.getItem("user"));

if (!token || !user || user.role !== "instructor") {
    window.location.href = "login.html";
}

const form = document.getElementById("assignmentForm");
const msg = document.getElementById("msg");
const btn = document.getElementById("createBtn");
const assignmentsContainer = document.getElementById("assignmentsContainer");

// =======================
// Load My Assignments
// =======================

async function loadAssignments() {

    try {

        const res = await fetch(
            "https://lms-back-7t0r.onrender.com/api/assignments/my-assignments",
            {
                headers: {
                    Authorization: `Bearer ${token}`
                }
            }
        );

        const assignments = await res.json();

        assignmentsContainer.innerHTML = "";

        if (assignments.length === 0) {

            assignmentsContainer.innerHTML = `
                <p>No assignments created yet.</p>
            `;

            return;
        }

        assignments.forEach(assignment => {

            assignmentsContainer.innerHTML += `

                <div class="course-card">

                    <h3>${assignment.title}</h3>

                    <p>${assignment.description}</p>

                    <p>
                        <strong>Due Date:</strong>
                        ${new Date(assignment.dueDate).toLocaleDateString()}
                    </p>

                    <button
                        class="delete-btn"
                        onclick="deleteAssignment('${assignment._id}')"
                    >
                        Delete
                    </button>

                </div>

            `;

        });

    } catch (error) {

        console.log(error);

        assignmentsContainer.innerHTML =
            "<p>Failed to load assignments.</p>";

    }

}

loadAssignments();


// =======================
// Create Assignment
// =======================

form.addEventListener("submit", async (e) => {

    e.preventDefault();

    btn.disabled = true;
    btn.textContent = "Creating...";

    try {

        const res = await fetch(
            "https://lms-back-7t0r.onrender.com/api/assignments/create",
            {

                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    Authorization: `Bearer ${token}`
                },

                body: JSON.stringify({

                    title: title.value,
                    description: description.value,
                    dueDate: dueDate.value

                })

            }
        );

        const data = await res.json();

        if (res.ok) {

            msg.style.color = "green";
            msg.textContent = "Assignment created successfully 🎉";

            form.reset();

            loadAssignments();

        } else {

            msg.style.color = "red";
            msg.textContent = data.message;

        }

    } catch (error) {

        msg.style.color = "red";
        msg.textContent = "Something went wrong.";

    }

    btn.disabled = false;
    btn.textContent = "Create Assignment";

});


// =======================
// Delete Assignment
// =======================

async function deleteAssignment(id) {

    const confirmDelete = confirm(
        "Are you sure you want to delete this assignment?"
    );

    if (!confirmDelete) return;

    try {

        const res = await fetch(
            `https://lms-back-7t0r.onrender.com/api/assignments/${id}`,
            {

                method: "DELETE",

                headers: {
                    Authorization: `Bearer ${token}`
                }

            }
        );

        const data = await res.json();

        alert(data.message);

        loadAssignments();

    } catch (error) {

        alert("Failed to delete assignment.");

    }

}


// =======================
// Logout
// =======================

function logout() {

    localStorage.clear();

    window.location.href = "login.html";

}
</script>

</body>
</html>
