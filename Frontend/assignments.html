<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assignments - Pathe Initiative</title>
<link rel="stylesheet" href="css/dashboard.css">
<style>
:root{--primary:#22c55e;--primary-dark:#16a34a;--white:#fff;}
.assignment-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:25px;margin-top:30px;}
.assignment-card{background:var(--white);border-radius:15px;padding:25px;box-shadow:0 5px 20px rgba(0,0,0,.08);}
.assignment-card h3{color:var(--primary-dark);margin-bottom:12px;}
.assignment-card p{color:#555;line-height:1.6;margin-bottom:10px;}
.due-date{color:#ef4444!important;font-weight:600;}
.submit-btn{display:inline-block;margin-top:15px;padding:12px 20px;background:var(--primary);color:#fff;text-decoration:none;border-radius:8px;font-weight:600;}
.submit-btn:hover{background:var(--primary-dark);}
.status{display:inline-block;padding:6px 10px;border-radius:20px;font-size:13px;font-weight:700;margin-top:5px;}
.status.pending{background:#fef3c7;color:#92400e;}
.status.submitted{background:#dbeafe;color:#1d4ed8;}
.status.graded{background:#dcfce7;color:#166534;}
.grade{font-weight:700;color:#166534;margin-top:10px;}
.empty-state{background:white;padding:40px;border-radius:15px;text-align:center;box-shadow:0 5px 20px rgba(0,0,0,.08);}

/* =========================
   RESPONSIVE DESIGN
========================= */

/* Tablets */
@media (max-width: 900px) {

    .assignment-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
    }

    .assignment-card {
        padding: 20px;
    }

    .main-content {
        padding: 20px;
    }
}


/* Mobile */
@media (max-width: 768px) {

    /* Page layout */
    .dashboard {
        display: block;
        width: 100%;
        min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
        position: fixed;
        top: 0;
        left: -280px;
        width: 260px;
        height: 100vh;
        z-index: 1000;
        transition: left 0.3s ease;
        box-sizing: border-box;
        overflow-y: auto;
    }

    .sidebar.active {
        left: 0;
    }

    /* Main content */
    .main-content {
        width: 100%;
        margin: 0;
        padding: 15px;
        box-sizing: border-box;
    }

    /* Navbar */
    .top-navbar {
        width: 100%;
        box-sizing: border-box;
        padding: 12px 15px;
    }

    .top-navbar .left {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .top-navbar h3 {
        font-size: 17px;
        margin: 0;
    }

    .hamburger {
        display: block;
        font-size: 22px;
        padding: 5px;
        cursor: pointer;
    }

    .right {
        gap: 8px;
    }

    .notification-btn {
        font-size: 17px;
    }

    .profile-btn {
        font-size: 13px;
        max-width: 100px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    /* Page heading */
    .main-content h1 {
        font-size: 25px;
        line-height: 1.3;
        margin-top: 20px;
    }

    .main-content > p {
        font-size: 14px;
        line-height: 1.5;
        color: #666;
    }

    /* Assignment grid */
    .assignment-grid {
        grid-template-columns: 1fr;
        gap: 15px;
        margin-top: 20px;
    }

    /* Assignment cards */
    .assignment-card {
        width: 100%;
        box-sizing: border-box;
        padding: 18px;
        border-radius: 12px;
    }

    .assignment-card h3 {
        font-size: 18px;
        line-height: 1.4;
        margin-bottom: 10px;
    }

    .assignment-card p {
        font-size: 14px;
        line-height: 1.6;
    }

    .due-date {
        font-size: 13px !important;
    }

    /* Status */
    .status {
        font-size: 12px;
        padding: 5px 9px;
    }

    /* Submit button */
    .submit-btn {
        display: block;
        width: 100%;
        box-sizing: border-box;
        text-align: center;
        padding: 11px 15px;
        margin-top: 15px;
        font-size: 14px;
    }

    /* Grade */
    .grade {
        font-size: 14px !important;
    }

    /* Empty state */
    .empty-state {
        padding: 30px 20px;
    }

    .empty-state h2 {
        font-size: 20px;
    }

    .empty-state p {
        font-size: 14px;
    }
}


/* Small phones */
@media (max-width: 480px) {

    .main-content {
        padding: 12px;
    }

    .top-navbar {
        padding: 10px 12px;
    }

    .top-navbar h3 {
        font-size: 16px;
    }

    .main-content h1 {
        font-size: 22px;
    }

    .assignment-card {
        padding: 16px;
    }

    .assignment-card h3 {
        font-size: 17px;
    }

    .assignment-card p {
        font-size: 13px;
    }

    .submit-btn {
        font-size: 13px;
        padding: 10px 12px;
    }
}
</style>
</head>
<body>
<div class="dashboard">
<aside class="sidebar">
<h2>Pathe Initiative</h2>
<a href="dashboard.html">Dashboard</a>
<a href="assignments.html">Assignments</a>
<a href="student-attendance.html">Attendance</a>
<a href="#" onclick="logout()">Logout</a>
</aside>
<main class="main-content">
      <!-- TOP NAVBAR -->
    <div class="top-navbar">
          <div class="left">
        <button class="hamburger" onclick="toggleSidebar()">☰</button>
        <h3>Dashboard</h3>
    </div>

        <div class="right">
            <button class="notification-btn">🔔</button>
<a href="profile.html" class="profile-btn" id="username">User</a>        </div>
    </div>

<h1>Available Assignments</h1>
<p>Complete and submit your assignments before their due dates.</p>
<div class="assignment-grid" id="assignmentContainer"></div>
</main>
</div>
<script>
const API = "https://lms-back-7t0r.onrender.com/api";
const token = localStorage.getItem("token");
const user = JSON.parse(localStorage.getItem("user") || "null");
const container = document.getElementById("assignmentContainer");

if (!token || !user || user.role !== "student") {
    window.location.href = "login.html";
}

// ✅ Set username in navbar
document.getElementById("username").textContent = user.fullname;

function toggleSidebar() {
    document.querySelector(".sidebar").classList.toggle("active");
}

function escapeHtml(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

async function loadAssignments() {
    try {
        const [assignmentRes, submissionRes] = await Promise.all([
            fetch(`${API}/assignments/all`, {
                headers: { Authorization: `Bearer ${token}` }
            }),
            fetch(`${API}/submissions/my-submissions`, {
                headers: { Authorization: `Bearer ${token}` }
            })
        ]);

        const assignments = await assignmentRes.json();
        const submissions = await submissionRes.json();

        if (!assignmentRes.ok) throw new Error(assignments.message || "Failed to load assignments");
        if (!submissionRes.ok) throw new Error(submissions.message || "Failed to load submissions");

        const submissionMap = new Map(
            submissions.map(submission => [submission.assignment?._id, submission])
        );

        container.innerHTML = "";

        if (!assignments.length) {
            container.innerHTML = `<div class="empty-state"><h2>No Assignments Yet</h2><p>Your instructor hasn't uploaded any assignments.</p></div>`;
            return;
        }

        assignments.forEach(assignment => {
            const submission = submissionMap.get(assignment._id);
            let statusHtml = `<span class="status pending">Not Submitted</span>`;
            let actionHtml = `<a href="submit-assignment.html?id=${encodeURIComponent(assignment._id)}" class="submit-btn">Submit Assignment</a>`;
            let gradeHtml = "";

            if (submission?.status === "graded") {
                statusHtml = `<span class="status graded">✓ Graded</span>`;
                gradeHtml = `<p class="grade">Grade: ${submission.grade}/100</p>`;
                actionHtml = `<a href="submit-assignment.html?id=${encodeURIComponent(assignment._id)}" class="submit-btn">View Result</a>`;
            } else if (submission) {
                statusHtml = `<span class="status submitted">Submitted · Awaiting Grading</span>`;
                actionHtml = `<a href="submit-assignment.html?id=${encodeURIComponent(assignment._id)}" class="submit-btn">View Submission</a>`;
            }

            container.innerHTML += `
                <div class="assignment-card">
                    <h3>${escapeHtml(assignment.title)}</h3>
                    <p>${escapeHtml(assignment.description)}</p>
                    <p class="due-date">Due: ${new Date(assignment.dueDate).toLocaleDateString()}</p>
                    ${statusHtml}
                    ${gradeHtml}
                    <div>${actionHtml}</div>
                </div>
            `;
        });
    } catch (error) {
        console.error(error);
        container.innerHTML = `<div class="empty-state"><h2>Unable to load assignments</h2><p>${escapeHtml(error.message)}</p></div>`;
    }
}

loadAssignments();

function logout() {
    localStorage.clear();
    window.location.href = "login.html";
}
</script>
</body>
</html>
