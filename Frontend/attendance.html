<!DOCTYPE html>
<html>
<head>
    <title>Attendance</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <style>

:root{
    --primary:#22c55e;
    --primary-dark:#16a34a;
    --bg-light:#f0fdf4;
    --white:#ffffff;
    --text-dark:#1f2937;
}

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:var(--bg-light);
}

.main-content{
    flex:1;
    padding:40px;
}

.main-content h1{
    color:var(--primary-dark);
    margin-bottom:30px;
}

#studentContainer{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:25px;
}

.course-card{
    background:var(--white);
    border-radius:15px;
    padding:25px;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
    transition:.3s;
}

.course-card:hover{
    transform:translateY(-4px);
}

.course-card h3{
    color:var(--text-dark);
    margin-bottom:20px;
}

.course-card select{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-size:15px;
    outline:none;
    cursor:pointer;
    background:white;
    transition:.3s;
}

.course-card select:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 3px rgba(34,197,94,.2);
}

.save-btn{
    margin-top:35px;
    padding:14px 30px;
    border:none;
    border-radius:10px;
    background:var(--primary);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.save-btn:hover{
    background:var(--primary-dark);
    transform:translateY(-2px);
    box-shadow:0 8px 18px rgba(34,197,94,.25);
}

#msg{
    margin-top:20px;
    color:var(--primary-dark);
    font-weight:bold;
    font-size:16px;
}

.avatar{
    width:60px;
    height:60px;
    border-radius:50%;
    background:var(--primary);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:bold;
    margin-bottom:18px;
}

@media(max-width:768px){

    .main-content{
        padding:20px;
    }

    #studentContainer{
        grid-template-columns:1fr;
    }

    .save-btn{
        width:100%;
    }

}

</style>
</head>
<body>

<div class="dashboard">

   <aside class="sidebar">
        <h2>Instructor Panel</h2>
        <a href="instructor-dashboard.html">Dashboard</a>
                <a href="upload.html">Upload Video</a>
                 <a href="students.html"> Add Students</a>
        <a href="instructor-assignments.html">Assignments</a>
        <a href="attendance-history.html">Attendance History</a>
        <a href="#" onclick="logout()">Logout</a>
    </aside>

<main class="main-content">

    <h1>Mark Attendance</h1>

    <div id="studentContainer"></div>

    <button
    class="save-btn"
    onclick="saveAttendance()"
>
    Save Attendance
</button>

    <p id="msg"></p>

</main>

</div>

<script>
const token = localStorage.getItem("token");

const container = document.getElementById("studentContainer");

let attendanceRecords = [];
console.log(attendanceRecords);

// ✅ Load students
async function loadStudents() {

    const res = await fetch(
        "https://lms-back-7t0r.onrender.com/api/students",
        {
            headers: {
                Authorization: `Bearer ${token}`
            }
        }
    );

    const students = await res.json();

    container.innerHTML = "";

    attendanceRecords = [];

    students.forEach(student => {

const initials = student.fullname
    .split(" ")
    .map(name => name[0])
    .join("")
    .toUpperCase();

container.innerHTML += `
    <div class="course-card">

        <div class="avatar">${initials}</div>

        <h3>${student.fullname}</h3>

        <select onchange="updateStatus('${student._id}', this.value)">
            <option value="present">Present</option>
            <option value="absent">Absent</option>
        </select>

    </div>
`;

        attendanceRecords.push({
            student: student._id,
            status: "present"
        });
    });
}

// ✅ Update attendance status
function updateStatus(studentId, status) {

    const record = attendanceRecords.find(
        r => r.student === studentId
    );

    record.status = status;
}

// ✅ Save attendance
async function saveAttendance() {

    await fetch(
        "https://lms-back-7t0r.onrender.com/api/attendance/mark",
        {
            method: "POST",

            headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`
            },

            body: JSON.stringify({
                records: attendanceRecords
            })
        }
    );

    document.getElementById("msg").textContent =
        "Attendance saved successfully";
}

loadStudents();

function logout() {
    localStorage.removeItem("token");
    localStorage.removeItem("user");
    window.location.href = "login.html";
}
</script>

</body>
</html>
