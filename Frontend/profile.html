<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile - Pathe Initiative</title>

    <link rel="stylesheet" href="css/dashboard.css">

    <style>
        /* =========================
           PROFILE PAGE
        ========================= */

        .profile-card {
            max-width: 700px;
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .profile-card h2 {
            margin-top: 0;
            margin-bottom: 25px;
            color: #16a34a;
            font-size: 24px;
        }

        .profile-card p {
            margin: 0;
            padding: 16px 0;
            border-bottom: 1px solid #eeeeee;
            color: #555;
            font-size: 16px;
        }

        .profile-card p:last-child {
            border-bottom: none;
        }

        .profile-card strong {
            display: inline-block;
            width: 100px;
            color: #222;
        }

        /* =========================
           HAMBURGER
        ========================= */

        .hamburger {
            display: none;
            border: none;
            background: transparent;
            font-size: 26px;
            cursor: pointer;
            padding: 5px;
            line-height: 1;
            color: #222;
        }

        /* =========================
           SIDEBAR OVERLAY
        ========================= */

        .sidebar-overlay {
            display: none;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 768px) {

            .dashboard {
                width: 100%;
                min-height: 100vh;
            }

            /* Sidebar */

            .sidebar {
                position: fixed;
                top: 0;
                left: -280px;

                width: 260px;
                height: 100vh;

                z-index: 1001;

                box-sizing: border-box;
                overflow-y: auto;

                transition: left 0.3s ease;
            }

            .sidebar.active {
                left: 0;
            }

            /* Sidebar close button */

            .close-sidebar {
                display: block;
                position: absolute;

                top: 12px;
                right: 15px;

                border: none;
                background: transparent;

                color: white;
                font-size: 30px;
                line-height: 1;

                cursor: pointer;
            }

            /* Overlay */

            .sidebar-overlay {
                display: block;

                position: fixed;
                inset: 0;

                background: rgba(0, 0, 0, 0.45);

                z-index: 1000;

                opacity: 0;
                visibility: hidden;

                transition:
                    opacity 0.3s ease,
                    visibility 0.3s ease;
            }

            .sidebar-overlay.active {
                opacity: 1;
                visibility: visible;
            }

            /* Content */

            .content-area {
                width: 100%;
                margin: 0;
            }

            .main-content {
                width: 100%;
                box-sizing: border-box;
                padding: 15px;
            }

            /* Navbar */

            .top-navbar {
                width: 100%;
                min-height: 60px;

                box-sizing: border-box;

                display: flex;
                align-items: center;
                justify-content: space-between;

                padding: 10px 15px;
            }

            .top-navbar .left {
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .top-navbar .left h3 {
                margin: 0;
                font-size: 18px;
            }

            .hamburger {
                display: flex;

                width: 42px;
                height: 42px;

                align-items: center;
                justify-content: center;

                font-size: 25px;

                border-radius: 8px;
            }

            .hamburger:active {
                background: #f0f0f0;
            }

            .top-navbar .right {
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .notification-btn {
                font-size: 18px;
            }

            .profile-btn {
                max-width: 100px;

                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;

                font-size: 13px;
            }

            /* Profile */

            .profile-card {
                width: 100%;
                max-width: none;

                box-sizing: border-box;

                padding: 20px;

                border-radius: 14px;
            }

            .profile-card h2 {
                font-size: 21px;
                margin-bottom: 15px;
            }

            .profile-card p {
                display: flex;
                flex-direction: column;

                gap: 5px;

                padding: 14px 0;

                font-size: 14px;
                line-height: 1.5;
            }

            .profile-card strong {
                width: auto;
                font-size: 13px;
                color: #222;
            }
        }

        /* =========================
           SMALL PHONES
        ========================= */

        @media (max-width: 480px) {

            .top-navbar {
                min-height: 56px;
                padding: 8px 12px;
            }

            .hamburger {
                width: 40px;
                height: 40px;
                font-size: 23px;
            }

            .top-navbar .left h3 {
                font-size: 16px;
            }

            .main-content {
                padding: 12px;
            }

            .profile-card {
                padding: 18px;
            }

            .profile-card h2 {
                font-size: 20px;
            }

            .profile-card p {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

<div class="dashboard">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

        <h2>Pathe Initiative</h2>

        <button
            class="close-sidebar"
            onclick="toggleSidebar()"
            aria-label="Close menu"
        >
            ×
        </button>

        <a href="dashboard.html">Dashboard</a>
        <a href="assignments.html">Assignments</a>
        <a href="student-attendance.html">Attendance</a>
        <a href="#" onclick="logout()">Logout</a>

    </aside>


    <!-- MOBILE OVERLAY -->
    <div
        class="sidebar-overlay"
        onclick="toggleSidebar()"
    ></div>


    <div class="content-area">

        <!-- TOP NAVBAR -->
        <div class="top-navbar">

            <div class="left">

                <button
                    class="hamburger"
                    onclick="toggleSidebar()"
                    aria-label="Open menu"
                >
                    ☰
                </button>

                <h3>Profile</h3>

            </div>


            <div class="right">

                <button class="notification-btn">
                    🔔
                </button>

                <a
                    href="profile.html"
                    class="profile-btn"
                    id="navUsername"
                >
                    User
                </a>

            </div>

        </div>


        <!-- MAIN CONTENT -->
        <main class="main-content">

            <div class="profile-card">

                <h2>Student Information</h2>

                <p>
                    <strong>Name:</strong>
                    <span id="name"></span>
                </p>

                <p>
                    <strong>Email:</strong>
                    <span id="email"></span>
                </p>

                <p>
                    <strong>Program:</strong>
                    <span id="program"></span>
                </p>

                <p>
                    <strong>Level:</strong>
                    <span id="level"></span>
                </p>

            </div>

        </main>

    </div>

</div>


<script>

const token = localStorage.getItem("token");
const user = JSON.parse(
    localStorage.getItem("user") || "null"
);


// Protect page
if (!token || !user) {
    window.location.href = "login.html";
}


// Navbar username
document.getElementById("navUsername").textContent =
    user.fullname;


// Profile details
document.getElementById("name").textContent =
    user.fullname;

document.getElementById("email").textContent =
    user.email;

document.getElementById("program").textContent =
    user.program || "Not set";

document.getElementById("level").textContent =
    user.level || "Not set";


// Sidebar
function toggleSidebar() {

    document
        .getElementById("sidebar")
        .classList.toggle("active");

    document
        .querySelector(".sidebar-overlay")
        .classList.toggle("active");
}


// Logout
function logout() {

    localStorage.removeItem("token");
    localStorage.removeItem("user");

    window.location.href = "login.html";
}

</script>

</body>
</html>
