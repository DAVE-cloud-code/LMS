<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="css/dashboard.css">

    <style>
        /* =====================================
           ADMIN DASHBOARD
        ===================================== */

        .admin-content {
            padding: 25px;
        }

        .admin-content h1 {
            margin-bottom: 25px;
        }

        /* =====================================
           MOBILE HEADER
        ===================================== */

        .admin-mobile-header {
            display: none;
        }

        .hamburger {
            border: none;
            background: transparent;
            font-size: 27px;
            cursor: pointer;
            color: #222;
            padding: 5px;
            line-height: 1;
        }

        /* =====================================
           SIDEBAR
        ===================================== */

        .sidebar {
            z-index: 1001;
        }

        .close-sidebar {
            display: none;
        }

        /* =====================================
           OVERLAY
        ===================================== */

        .sidebar-overlay {
            display: none;
        }

        /* =====================================
           STATISTICS
        ===================================== */

        .stats {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #fff;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .stat-card h3 {
            margin: 0 0 10px;
            color: #555;
            font-size: 16px;
        }

        .stat-card p {
            margin: 0;
            color: #16a34a;
            font-size: 32px;
            font-weight: 700;
        }

        /* =====================================
           SECTIONS
        ===================================== */

        .dashboard-section {
            background: #fff;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .dashboard-section h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 20px;
        }

        /* =====================================
           FORMS
        ===================================== */

        .dashboard-section form {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .dashboard-section input,
        .dashboard-section select {
            flex: 1;
            min-width: 180px;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        .dashboard-section input:focus,
        .dashboard-section select:focus {
            border-color: #22c55e;
        }

        .dashboard-section button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #22c55e;
            color: white;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }

        .dashboard-section button:hover {
            background: #16a34a;
        }

        /* =====================================
           TABLES
        ===================================== */

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .dashboard-section table {
            width: 100%;
            min-width: 600px;
            border-collapse: collapse;
        }

        .dashboard-section th,
        .dashboard-section td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        .dashboard-section th {
            background: #f8fafc;
            color: #333;
            font-weight: 600;
        }

        .dashboard-section tr:hover td {
            background: #fafafa;
        }

        .delete-btn {
    background: #ef4444 !important;
    color: white;
    border: none;
    padding: 8px 14px !important;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
}

.delete-btn:hover {
    background: #dc2626 !important;
}


        /* =====================================
           MOBILE
        ===================================== */

        @media (max-width: 768px) {

            /* Main layout */

            .dashboard {
                display: block;
                width: 100%;
                min-height: 100vh;
            }

            /* Sidebar */

            .sidebar {
                position: fixed;
                top: 0;
                left: -280px;

                width: 260px;
                height: 100vh;

                box-sizing: border-box;

                z-index: 1001;

                overflow-y: auto;

                transition: left 0.3s ease;
            }

            .sidebar.active {
                left: 0;
            }

            /* Sidebar close button */

            .close-sidebar {
                display: block;

                position: absolute;
                top: 12px;
                right: 15px;

                border: none;
                background: transparent;

                color: white;
                font-size: 30px;
                line-height: 1;

                cursor: pointer;
            }

            /* Overlay */

            .sidebar-overlay {
                display: block;

                position: fixed;
                inset: 0;

                background: rgba(0, 0, 0, 0.45);

                z-index: 1000;

                opacity: 0;
                visibility: hidden;

                transition:
                    opacity 0.3s ease,
                    visibility 0.3s ease;
            }

            .sidebar-overlay.active {
                opacity: 1;
                visibility: visible;
            }

            /* Mobile header */

            .admin-mobile-header {
                display: flex;

                align-items: center;
                justify-content: space-between;

                width: 100%;
                min-height: 60px;

                padding: 8px 15px;

                box-sizing: border-box;

                background: #fff;

                border-bottom: 1px solid #eee;

                position: sticky;
                top: 0;

                z-index: 900;
            }

            .admin-mobile-header h2 {
                margin: 0;
                font-size: 18px;
            }

            /* Content */

            .main-content {
                width: 100%;
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            .admin-content {
                padding: 15px;
            }

            .admin-content h1 {
                font-size: 24px;
                margin: 10px 0 20px;
            }

            /* Stats */

            .stats {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
                margin-bottom: 20px;
            }

            .stat-card {
                padding: 18px 15px;
                border-radius: 12px;
            }

            .stat-card h3 {
                font-size: 13px;
            }

            .stat-card p {
                font-size: 27px;
            }

            /* Sections */

            .dashboard-section {
                padding: 18px;
                margin-bottom: 18px;
                border-radius: 12px;
            }

            .dashboard-section h2 {
                font-size: 18px;
                margin-bottom: 15px;
            }

            /* Forms */

            .dashboard-section form {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            .dashboard-section input,
            .dashboard-section select {
                width: 100%;
                min-width: 0;
                flex: none;

                padding: 13px;

                font-size: 14px;
            }

            .dashboard-section button {
                width: 100%;
                padding: 13px;
                font-size: 14px;
            }

            /* Tables */

            .table-wrapper {
                margin: 0 -5px;
                width: calc(100% + 10px);
            }

            .dashboard-section table {
                min-width: 600px;
            }

            .dashboard-section th,
            .dashboard-section td {
                padding: 12px 10px;
                font-size: 13px;
            }

              .delete-btn {
        padding: 9px 14px !important;
        font-size: 13px;
    }

        }

        /* =====================================
           SMALL PHONES
        ===================================== */

        @media (max-width: 480px) {

            .admin-mobile-header {
                min-height: 56px;
                padding: 8px 12px;
            }

            .admin-mobile-header h2 {
                font-size: 16px;
            }

            .hamburger {
                font-size: 24px;
            }

            .admin-content {
                padding: 12px;
            }

            .admin-content h1 {
                font-size: 22px;
            }

            .stats {
                gap: 10px;
            }

            .stat-card {
                padding: 15px 12px;
            }

            .stat-card h3 {
                font-size: 12px;
            }

            .stat-card p {
                font-size: 24px;
            }

            .dashboard-section {
                padding: 15px;
            }

            .dashboard-section h2 {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

<div class="dashboard">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

        <h2>Admin Panel</h2>

        <button
            class="close-sidebar"
            onclick="toggleSidebar()"
            aria-label="Close menu"
        >
            ×
        </button>

        <a href="#">Dashboard</a>
        <a href="#">Users</a>
        <a href="#" onclick="logout()">Logout</a>

    </aside>


    <!-- MOBILE OVERLAY -->
    <div
        class="sidebar-overlay"
        onclick="toggleSidebar()"
    ></div>


    <main class="main-content">

        <!-- MOBILE HEADER -->
        <header class="admin-mobile-header">

            <button
                class="hamburger"
                onclick="toggleSidebar()"
                aria-label="Open menu"
            >
                ☰
            </button>

            <h2>Admin Panel</h2>

            <div style="width: 34px;"></div>

        </header>


        <div class="admin-content">

            <h1>Admin Dashboard</h1>


            <!-- STATS -->
            <div class="stats">

                <div class="stat-card">
                    <h3>Students</h3>
                    <p id="studentCount">0</p>
                </div>

                <div class="stat-card">
                    <h3>Instructors</h3>
                    <p id="instructorCount">0</p>
                </div>

            </div>


            <!-- CREATE INSTRUCTOR -->
            <section class="dashboard-section">

                <h2>Create Instructor</h2>

                <form id="createInstructorForm">

                    <input
                        type="text"
                        id="fullname"
                        placeholder="Full Name"
                        required
                    >

                    <input
                        type="email"
                        id="email"
                        placeholder="Email"
                        required
                    >

                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        required
                    >

                    <button type="submit">
                        Create Instructor
                    </button>

                </form>

            </section>


            <!-- ASSIGN PLACEMENT -->
            <section class="dashboard-section">

                <h2>Assign Placement</h2>

                <form id="placementForm">

                    <select id="instructorSelect" required>
                        <option value="">Select Instructor</option>
                    </select>

                    <input
                        type="text"
                        id="placement"
                        placeholder="Placement"
                        required
                    >

                    <input
                        type="text"
                        id="school"
                        placeholder="School"
                        required
                    >

                    <button
                        type="submit"
                        class="adm"
                    >
                        Assign
                    </button>

                </form>

            </section>


            <!-- STUDENTS -->
            <section class="dashboard-section">

                <h2>Students</h2>

                <div class="table-wrapper">

                    <table>

                        <thead>
                            <tr>
    <th>Name</th>
    <th>Email</th>
    <th>Action</th>
</tr>

                        </thead>

                        <tbody id="studentsTable"></tbody>

                    </table>

                </div>

            </section>


            <!-- INSTRUCTORS -->
            <section class="dashboard-section">

                <h2>Instructors</h2>

                <div class="table-wrapper">

                    <table>

                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Placement</th>
                                <th>School</th>
                            </tr>
                        </thead>

                        <tbody id="instructorsTable"></tbody>

                    </table>

                </div>

            </section>

        </div>

    </main>

</div>


<script>

const token = localStorage.getItem("token");
const user = JSON.parse(localStorage.getItem("user"));

const studentsTable =
    document.getElementById("studentsTable");

const instructorsTable =
    document.getElementById("instructorsTable");

const instructorSelect =
    document.getElementById("instructorSelect");


/* =========================
   SIDEBAR
========================= */

function toggleSidebar() {

    document
        .getElementById("sidebar")
        .classList.toggle("active");

    document
        .querySelector(".sidebar-overlay")
        .classList.toggle("active");
}


/* =========================
   LOAD USERS
========================= */

async function loadUsers() {

    const res = await fetch(
        "https://lms-back-7t0r.onrender.com/api/auth/users",
        {
            headers: {
                Authorization: `Bearer ${token}`
            }
        }
    );

    const users = await res.json();

    studentsTable.innerHTML = "";
    instructorsTable.innerHTML = "";
    instructorSelect.innerHTML =
        '<option value="">Select Instructor</option>';


    const students =
        users.filter(u => u.role === "student");

    const instructors =
        users.filter(u => u.role === "instructor");


    document.getElementById("studentCount")
        .textContent = students.length;

    document.getElementById("instructorCount")
        .textContent = instructors.length;


   students.forEach(student => {

    studentsTable.innerHTML += `
        <tr>
            <td>${student.fullname}</td>
            <td>${student.email}</td>
            <td>
                <button
                    class="delete-btn"
                    onclick="deleteUser('${student._id}', '${student.fullname.replace(/'/g, "\\'")}')"
                >
                    Delete
                </button>
            </td>
        </tr>
    `;

});



instructors.forEach(instructor => {

    instructorsTable.innerHTML += `
        <tr>

            <td>${instructor.fullname}</td>

            <td>${instructor.email}</td>

            <td>${instructor.placement || "Not Assigned"}</td>

            <td>${instructor.school || "No School Assigned"}</td>

            <td>
                <button
                    class="delete-btn"
                    onclick="deleteUser('${instructor._id}', '${instructor.fullname.replace(/'/g, "\\'")}')"
                >
                    Delete
                </button>
            </td>

        </tr>
    `;

});


}


/* =========================
   CREATE INSTRUCTOR
========================= */

document
    .getElementById("createInstructorForm")
    .addEventListener("submit", async e => {

        e.preventDefault();

        const fullname =
            document.getElementById("fullname").value;

        const email =
            document.getElementById("email").value;

        const password =
            document.getElementById("password").value;


        const res = await fetch(
            "https://lms-back-7t0r.onrender.com/api/auth/create-instructor",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    Authorization: `Bearer ${token}`
                },

                body: JSON.stringify({
                    fullname,
                    email,
                    password
                })
            }
        );


        if (res.ok) {

            alert("Instructor created successfully!");

            e.target.reset();

            loadUsers();

        } else {

            const result = await res.json();

            alert(
                result.message ||
                "Unable to create instructor."
            );

        }

    });


/* =========================
   ASSIGN PLACEMENT
========================= */

document
    .getElementById("placementForm")
    .addEventListener("submit", async e => {

        e.preventDefault();

        const instructorId =
            instructorSelect.value;

        const placement =
            document.getElementById("placement").value;

        const school =
            document.getElementById("school").value;


        if (!instructorId) {
            alert("Please select an instructor.");
            return;
        }


        const res = await fetch(
            `https://lms-back-7t0r.onrender.com/api/users/assign-placement/${instructorId}`,
            {
                method: "PUT",

                headers: {
                    "Content-Type": "application/json",
                    Authorization: `Bearer ${token}`
                },

                body: JSON.stringify({
                    placement,
                    school
                })
            }
        );


        if (res.ok) {

            alert("Placement assigned successfully!");

            e.target.reset();

            loadUsers();

        } else {

            const result = await res.json();

            alert(
                result.message ||
                "Unable to assign placement."
            );

        }

    });

    async function deleteUser(userId, fullname) {

    const confirmed = confirm(
        `Are you sure you want to delete ${fullname}?`
    );

    if (!confirmed) {
        return;
    }

    try {

        const res = await fetch(
            `https://lms-back-7t0r.onrender.com/api/auth/users/${userId}`,
            {
                method: "DELETE",

                headers: {
                    Authorization: `Bearer ${token}`
                }
            }
        );

        const result = await res.json();

        if (!res.ok) {
            throw new Error(
                result.message || "Failed to delete user."
            );
        }

        alert(result.message);

        // Refresh students/instructors
        loadUsers();

    } catch (error) {

        console.error("Delete error:", error);

        alert(error.message);

    }
}



/* =========================
   LOGOUT
========================= */

function logout() {

    localStorage.clear();

    window.location.href = "login.html";

}


/* =========================
   INITIAL LOAD
========================= */

window.addEventListener("DOMContentLoaded", () => {
    loadUsers();
});

</script>

</body>
</html>
