<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

<div class="dashboard">

    <aside class="sidebar">
        <h2>Admin Panel</h2>
        <a href="#">Dashboard</a>
        <a href="#">Users</a>
        <a href="#">Courses</a>
        <a href="#" onclick="logout()">Logout</a>
    </aside>

    <main class="main-content">

    <h1>Admin Dashboard</h1>

    <div class="stats">

        <div class="stat-card">
            <h3>Students</h3>
            <p id="studentCount">0</p>
        </div>

        <div class="stat-card">
            <h3>Instructors</h3>
            <p id="instructorCount">0</p>
        </div>

    </div>

    <section class="dashboard-section">

        <h2>Create Instructor</h2>

        <form id="createInstructorForm">

            <input
                type="text"
                id="fullname"
                placeholder="Full Name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button>Create Instructor</button>

        </form>

    </section>


    <section class="dashboard-section">

        <h2>Assign Placement</h2>

        <form id="placementForm">

            <select id="instructorSelect"></select>

            <input
                type="text"
                id="placement"
                placeholder="Placement"
                required
            >

            <input
                type="text"
                id="school"
                placeholder="School"
                required
            >

            <button>Assign</button>

        </form>

    </section>


    <section class="dashboard-section">

        <h2>Students</h2>

        <table>

            <thead>

            <tr>
                <th>Name</th>
                <th>Email</th>
            </tr>

            </thead>

            <tbody id="studentsTable"></tbody>

        </table>

    </section>


    <section class="dashboard-section">

        <h2>Instructors</h2>

        <table>

            <thead>

            <tr>

                <th>Name</th>
                <th>Email</th>
                <th>Placement</th>
                <th>School</th>

            </tr>

            </thead>

            <tbody id="instructorsTable"></tbody>

        </table>

    </section>

    </main>

</div>

<script>
    const token = localStorage.getItem("token");
const user = JSON.parse(localStorage.getItem("user"));

const studentsTable=document.getElementById("studentsTable");
const instructorsTable=document.getElementById("instructorsTable");
const instructorSelect=document.getElementById("instructorSelect");

async function loadUsers(){

const res=await fetch(
"https://lms-back-7t0r.onrender.com/api/auth/users",
{
headers:{
Authorization:`Bearer ${token}`
}
});

const users=await res.json();

studentsTable.innerHTML="";
instructorsTable.innerHTML="";
instructorSelect.innerHTML="";

const students=users.filter(u=>u.role==="student");
const instructors=users.filter(u=>u.role==="instructor");

document.getElementById("studentCount").textContent=students.length;
document.getElementById("instructorCount").textContent=instructors.length;

students.forEach(student=>{

studentsTable.innerHTML+=`
<tr>
<td>${student.fullname}</td>
<td>${student.email}</td>
</tr>
`;

});

instructors.forEach(instructor=>{

instructorsTable.innerHTML+=`
<tr>

<td>${instructor.fullname}</td>

<td>${instructor.email}</td>

<td>${instructor.placement}</td>

<td>${instructor.school}</td>

</tr>
`;

instructorSelect.innerHTML+=`
<option value="${instructor._id}">
${instructor.fullname}
</option>
`;

});

}

document.getElementById("createInstructorForm")
.addEventListener("submit",async e=>{

e.preventDefault();

await fetch(
"https://lms-back-7t0r.onrender.com/api/auth/create-instructor",
{
method:"POST",

headers:{
"Content-Type":"application/json",
Authorization:`Bearer ${token}`
},

body:JSON.stringify({

fullname:fullname.value,
email:email.value,
password:password.value

})

});

loadUsers();

});

document.getElementById("placementForm")
.addEventListener("submit",async e=>{

e.preventDefault();

await fetch(
`https://lms-back-7t0r.onrender.com/api/users/assign-placement/${instructorSelect.value}`,
{

method:"PUT",

headers:{
"Content-Type":"application/json",
Authorization:`Bearer ${token}`
},

body:JSON.stringify({

placement:placement.value,
school:school.value

})

});

loadUsers();

});

window.onload = () => {
    loadUsers();
};

function logout() {
    localStorage.clear();
    window.location.href = "login.html";
}
</script>

</body>
</html>
