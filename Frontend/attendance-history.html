<!DOCTYPE html>
<html>
<head>
    <title>Attendance History</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <style>

:root{
    --primary:#22c55e;
    --primary-dark:#16a34a;
    --bg-light:#f0fdf4;
    --white:#fff;
    --text-dark:#1f2937;
}

body{
    margin:0;
    background:var(--bg-light);
    font-family:Arial,Helvetica,sans-serif;
}

.main-content{
    flex:1;
    padding:40px;
}

.main-content h1{
    color:var(--primary-dark);
    margin-bottom:35px;
}

#historyContainer{
    display:flex;
    flex-direction:column;
    gap:25px;
}

.course-card{
    background:white;
    border-radius:16px;
    padding:30px;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.course-card h2{
    color:var(--primary-dark);
    margin-top:0;
}

.course-card hr{
    margin:20px 0;
    border:none;
    border-top:1px solid #e5e7eb;
}

.attendance-record{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px;
    margin-bottom:12px;
    background:#f9fafb;
    border-radius:10px;
    border-left:5px solid var(--primary);
}

.attendance-record p{
    margin:0;
}

.empty-state{

    background:white;
    padding:50px;
    text-align:center;
    border-radius:16px;
    box-shadow:0 8px 20px rgba(0,0,0,.08);

}

.empty-state h2{

    color:var(--primary-dark);
    margin-bottom:15px;

}

@media(max-width:768px){

.main-content{

padding:20px;

}

.attendance-record{

flex-direction:column;
align-items:flex-start;
gap:8px;

}

}

</style>
</head>
<body>

<div class="dashboard">

    <!-- Sidebar -->
  <aside class="sidebar">
        <h2>Instructor Panel</h2>
        <a href="instructor-dashboard.html">Dashboard</a>
        <a href="upload.html">Upload Video</a>
                 <a href="students.html"> Add Students</a>
        <a href="attendance.html">Attendance</a>
        <a href="instructor-assignments.html">Assignments</a>
        <a href="#" onclick="logout()">Logout</a>
    </aside>

    <!-- Main Content -->
    <main class="main-content">

        <h1>Attendance History</h1>

        <div id="historyContainer"></div>

    </main>

</div>

<script>
const token = localStorage.getItem("token");
const user = JSON.parse(localStorage.getItem("user"));

if (!token || user.role !== "instructor") {
    window.location.href = "login.html";
}

const container = document.getElementById("historyContainer");

// ✅ Load attendance history
async function loadHistory() {

    try {

        const res = await fetch(
            "https://lms-back-7t0r.onrender.com/api/attendance/history",
            {
                headers: {
                    Authorization: `Bearer ${token}`
                }
            }
        );

const history = await res.json();

        container.innerHTML = "";

        if (history.length === 0) {
            container.innerHTML = `
                <p>No attendance records yet.</p>
            `;
            return;
        }

        history.forEach(session => {

            const date = new Date(session.createdAt)
                .toLocaleDateString();

            let recordsHTML = "";

            session.records.forEach(record => {

                recordsHTML += `
                    <div class="attendance-record">

                        <p>
                            <strong>
                                ${record.student?.fullname || "Unknown Student"}
                            </strong>
                        </p>

                        <p>
                            ${
                                record.status === "present"
                                ? "🟢 Present"
                                : "🔴 Absent"
                            }
                        </p>

                    </div>
                `;
            });

            container.innerHTML += `
                <div class="course-card">

                    <h2>
                        Attendance Record
                    </h2>

                    <p>
                        <strong>Date:</strong>
                        ${date}
                    </p>

                    <hr>

                    ${recordsHTML}

                </div>
            `;
        });

    } catch (error) {

        console.log(error);

        container.innerHTML = `
            <p>Failed to load attendance history.</p>
        `;
    }
}

// ✅ Logout
function logout() {
    localStorage.clear();
    window.location.href = "login.html";
}

loadHistory();
</script>

</body>
</html>
